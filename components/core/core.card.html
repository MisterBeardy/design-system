<!-- @dsCard group="Components" viewport="700x260" subtitle="Button, Chip, Card, Input, StatTile" name="Core primitives" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex; flex-direction:column; gap:14px; font-family:var(--font-display);">
  <div style="display:flex; gap:8px;">
    <button style="font-family:var(--font-display); font-weight:600; font-size:14px; padding:11px 20px; border-radius:var(--radius-md); background:var(--accent); color:#fff; border:none;">Primary</button>
    <button style="font-family:var(--font-display); font-weight:600; font-size:14px; padding:11px 20px; border-radius:var(--radius-md); background:var(--surface); color:var(--text-ink); border:1px solid var(--border);">Secondary</button>
    <button style="font-family:var(--font-display); font-weight:600; font-size:14px; padding:11px 20px; border-radius:var(--radius-md); background:var(--accent-soft); color:var(--accent-text); border:none;">Soft</button>
    <button style="font-family:var(--font-display); font-weight:500; font-size:14px; padding:11px 8px; border-radius:var(--radius-md); background:transparent; color:var(--text-muted); border:none;">Ghost</button>
  </div>
  <div style="display:flex; gap:8px;">
    <span style="font-family:var(--font-mono); font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--accent-text); border-radius:var(--radius-pill); padding:5px 12px;">SENT</span>
    <span style="font-family:var(--font-mono); font-size:11px; font-weight:600; background:var(--surface-alt); color:var(--text-muted); border-radius:var(--radius-pill); padding:5px 12px;">DRAFT</span>
  </div>
  <div style="display:flex; gap:10px;">
    <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px 14px; width:130px;">
      <div style="font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted);">States</div>
      <div style="font-size:24px; font-weight:700; color:var(--text-ink); margin-top:4px;">23</div>
    </div>
    <input placeholder="Search…" style="flex:1; font-family:var(--font-display); font-size:14px; color:var(--text-ink); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px;"/>
  </div>
</div>
