<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; align-items:center; gap:12px;">
  <div style="width:44px;height:44px;border-radius:var(--radius-sm);background:var(--surface-alt);border:1px solid var(--border);"></div>
  <div style="width:44px;height:44px;border-radius:var(--radius-md);background:var(--surface-alt);border:1px solid var(--border);"></div>
  <div style="width:44px;height:44px;border-radius:var(--radius-lg);background:var(--surface-alt);border:1px solid var(--border);"></div>
  <div style="width:44px;height:44px;border-radius:var(--radius-xl);background:var(--surface-alt);border:1px solid var(--border);"></div>
  <div style="width:44px;height:44px;border-radius:var(--radius-pill);background:var(--surface-alt);border:1px solid var(--border);"></div>
</div>
