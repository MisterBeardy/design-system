<!-- @dsCard group="Colors" viewport="700x200" subtitle="Success / warning / danger — app-agnostic" name="Status" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; flex-direction:column; gap:14px; font-family:var(--font-mono); font-size:11px;">
  <div style="display:flex; gap:24px;">
    <div style="display:flex; gap:8px; align-items:center;">
      <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--success);"></div>
      <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--success-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--success-text);font-weight:700;">Aa</div>
      <span style="color:var(--text-muted);">success</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--warning);"></div>
      <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--warning-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--warning-text);font-weight:700;">Aa</div>
      <span style="color:var(--text-muted);">warning</span>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--danger);"></div>
      <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--danger-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--danger-text);font-weight:700;">Aa</div>
      <span style="color:var(--text-muted);">danger</span>
    </div>
  </div>
  <div style="display:flex; gap:8px;">
    <span style="font-weight:600; background:var(--success-soft); color:var(--success-text); border-radius:var(--radius-pill); padding:5px 12px;">PAID</span>
    <span style="font-weight:600; background:var(--warning-soft); color:var(--warning-text); border-radius:var(--radius-pill); padding:5px 12px;">PENDING</span>
    <span style="font-weight:600; background:var(--danger-soft); color:var(--danger-text); border-radius:var(--radius-pill); padding:5px 12px;">OVERDUE</span>
  </div>
</div>
