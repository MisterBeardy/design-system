<!-- @dsCard group="Colors" viewport="700x220" subtitle="Six categories and a seven-step ramp" name="Data colour" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; flex-direction:column; gap:14px; font-family:var(--font-mono); font-size:11px; color:var(--text-muted);">
  <div style="display:flex; gap:8px; align-items:center;">
    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--data-1);color:var(--on-data);display:flex;align-items:center;justify-content:center;font-weight:700;">1</div>
    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--data-2);color:var(--on-data);display:flex;align-items:center;justify-content:center;font-weight:700;">2</div>
    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--data-3);color:var(--on-data);display:flex;align-items:center;justify-content:center;font-weight:700;">3</div>
    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--data-4);color:var(--on-data);display:flex;align-items:center;justify-content:center;font-weight:700;">4</div>
    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--data-5);color:var(--on-data);display:flex;align-items:center;justify-content:center;font-weight:700;">5</div>
    <div style="width:36px;height:36px;border-radius:var(--radius-md);background:var(--data-6);color:var(--on-data);display:flex;align-items:center;justify-content:center;font-weight:700;">6</div>
    <span>--data-1 … --data-6, in order</span>
  </div>
  <div style="display:flex; height:16px; gap:2px; border-radius:var(--radius-sm); overflow:hidden; max-width:420px;">
    <div style="flex-grow:38; background:var(--data-1);"></div>
    <div style="flex-grow:22; background:var(--data-2);"></div>
    <div style="flex-grow:14; background:var(--data-3);"></div>
    <div style="flex-grow:11; background:var(--data-4);"></div>
    <div style="flex-grow:9; background:var(--data-5);"></div>
    <div style="flex-grow:6; background:var(--data-6);"></div>
  </div>
  <div style="display:flex; flex-direction:column; gap:4px; max-width:420px;">
    <div style="display:flex; height:24px;">
      <div style="flex-grow:1; background:var(--ramp-1);"></div>
      <div style="flex-grow:1; background:var(--ramp-2);"></div>
      <div style="flex-grow:1; background:var(--ramp-3);"></div>
      <div style="flex-grow:1; background:var(--ramp-4);"></div>
      <div style="flex-grow:1; background:var(--ramp-5);"></div>
      <div style="flex-grow:1; background:var(--ramp-6);"></div>
      <div style="flex-grow:1; background:var(--ramp-7);"></div>
    </div>
    <div style="display:flex; justify-content:space-between;"><span>--ramp-1 fewer</span><span>more --ramp-7</span></div>
  </div>
</div>
