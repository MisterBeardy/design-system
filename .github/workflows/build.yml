# dist/index.js is generated by build.mjs and committed, because consumers
# install over a git URL and their builders can't be relied on to compile it
# (see build.mjs). That makes it easy to change a component and forget to
# rebuild: the stale dist then ships silently to every app. This rebuilds from
# the sources and fails if the result differs from what's committed.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The default accent matches app-registry.js, every label and glyph on a
  # coloured fill meets its contrast floor for every registered app, and
  # CHANGELOG.md has an entry for the version in package.json. (The job keeps
  # its original name so a required status check doesn't break.)
  colour-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  dist-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Also runs build.mjs's own guard: it throws if any JSX survived.
      - run: npm run build
      - name: Committed dist/ matches the sources
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
