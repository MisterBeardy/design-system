<!-- @dsCard group="Colors" viewport="700x160" subtitle="Neutral scale, light + dark" name="Neutrals" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<div style="display:flex; gap:16px; font-family: var(--font-mono); font-size:11px;">
  <div style="flex:1; padding:14px; border-radius:var(--radius-lg); background:var(--bg); border:1px solid var(--border);">
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <span style="width:24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--border);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--border);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--surface-alt);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--border);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--text-muted);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--text-ink);"></span>
    </div>
    <span style="color:var(--text-muted);">light</span>
  </div>
  <div data-theme="dark" style="flex:1; padding:14px; border-radius:var(--radius-lg); background:var(--bg); border:1px solid var(--border);">
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <span style="width:24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--border);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--border);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--surface-alt);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--border);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--text-muted);"></span>
      <span style="width:24px;height:24px;border-radius:6px;background:var(--text-ink);"></span>
    </div>
    <span style="color:var(--text-muted);">dark</span>
  </div>
</div>
